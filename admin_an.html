<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin AN — Blockchain de Animais</title>
<style>
:root{--bg:#0a0e17;--surface:#111827;--surface2:#1e293b;--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--accent:#10b981;--accent2:#059669;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--blue:#3b82f6;--orange:#f97316;--purple:#8b5cf6}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#064e3b,#0f172a);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
.header h1{font-size:1.3rem;font-weight:700}.header .badge{background:var(--accent);color:#000;padding:3px 10px;border-radius:12px;font-size:0.7rem;font-weight:600}
.header .nav{margin-left:auto;display:flex;gap:8px}.header .nav a{color:var(--text2);text-decoration:none;font-size:0.85rem;padding:6px 12px;border-radius:6px}.header .nav a:hover{background:var(--surface2);color:var(--text)}.header .nav a.active{background:var(--accent);color:#000}
.container{max-width:1200px;margin:0 auto;padding:16px}.grid2{display:grid;grid-template-columns:350px 1fr;gap:16px}
@media(max-width:768px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.card h2{font-size:1rem;margin-bottom:10px;color:var(--accent)}
input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:0.85rem;width:100%}input:focus,select:focus{outline:none;border-color:var(--accent)}
label{font-size:0.75rem;color:var(--text2);margin-bottom:2px;display:block}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#000}.btn-blue{background:var(--blue);color:#fff}.btn-red{background:var(--red);color:#fff}.btn-sm{padding:5px 12px;font-size:0.75rem}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:0.7rem;font-weight:600}
.tag-green{background:#166534;color:#86efac}.tag-red{background:#991b1b;color:#fca5a5}.tag-yellow{background:#854d0e;color:#fde047}.tag-blue{background:#1e3a5f;color:#93c5fd}.tag-purple{background:#581c87;color:#d8b4fe}
.empty{text-align:center;padding:30px;color:var(--text2)}.empty .icon{font-size:2.5rem;margin-bottom:8px}
.chain-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:6px;cursor:pointer;transition:all .2s;display:flex;justify-content:space-between;align-items:center}
.chain-item:hover{border-color:var(--accent)}.chain-item.sel{border-color:var(--accent);background:rgba(16,185,129,.1)}
.chain-item .info{flex:1}.chain-item .name{font-weight:600;font-size:0.9rem}.chain-item .sub{color:var(--text2);font-size:0.8rem}.chain-item .meta{text-align:right;font-size:0.75rem;color:var(--text2)}
.tl-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.85rem}.tl-item:last-child{border-bottom:none}
.status-bar{background:var(--surface2);border-radius:8px;padding:10px 14px;display:flex;gap:16px;font-size:0.8rem;margin-bottom:12px;flex-wrap:wrap}
.status-bar .stat{display:flex;flex-direction:column}.status-bar .stat-label{color:var(--text2);font-size:0.7rem}.status-bar .stat-value{font-weight:700;font-size:1rem}
.tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--border)}.tab{padding:7px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--text2);font-size:0.85rem}.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.hidden{display:none}.toast{position:fixed;top:16px;right:16px;padding:10px 16px;border-radius:8px;font-size:0.85rem;font-weight:600;z-index:999;animation:slideIn .3s}
.toast-ok{background:#166534;color:#86efac;border:1px solid #22c55e}.toast-err{background:#991b1b;color:#fca5a5;border:1px solid #ef4444}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center}.modal-overlay.active{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:550px;width:92%;max-height:80vh;overflow-y:auto}.modal h2{margin-bottom:12px;font-size:1.1rem}
</style>
</head>
<body>
<div class="header"><h1>🐾 Admin AN</h1><span class="badge">ECDSA</span><div class="nav"><a href="/">Home</a><a href="/admin/pf">PF</a><a href="/admin/im">IM</a><a href="/admin/mo">MO</a><a href="/admin/an" class="active">AN</a><a href="/admin/cross">Cross-Chain</a></div></div>
<div class="container"><div id="toast" class="hidden"></div><div class="grid2">
  <div><div class="card"><h2>🐾 Animais</h2><input id="search" placeholder="🔍 Buscar nome ou espécie..." oninput="filterList()"><div id="list" style="max-height:500px;overflow-y:auto;margin-top:8px"></div><div style="margin-top:10px"><button class="btn btn-primary btn-sm" onclick="openNew()">+ Novo Animal</button></div></div></div>
  <div><div id="detailView"><div class="empty"><div class="icon">🐾</div>Selecione um animal.</div></div></div>
</div></div>
<div class="modal-overlay" id="mo"><div class="modal"><h2 id="mTitle">Novo</h2><div id="mBody"></div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-primary btn-sm" id="mSubmit">Registrar</button><button class="btn btn-red btn-sm" onclick="closeM()">Cancelar</button></div></div></div>
<script>
let curKey='';let allItems=[];
function toast(m,ok=true){const e=document.getElementById('toast');e.textContent=m;e.className='toast toast-'+(ok?'ok':'err');e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
async function api(p,m='GET',b=null){const o={method:m,headers:{'Content-Type':'application/json'}};if(b)o.body=JSON.stringify(b);const r=await fetch(p,o);const j=await r.json();if(r.status>=400)throw new Error(j.detail||'Erro');return j}
async function loadList(){try{const r=await api('/api/an');allItems=r.data||[];renderList(allItems)}catch(e){toast(e.message,false)}}
function renderList(items){const el=document.getElementById('list');if(!items.length){el.innerHTML='<div class="empty">Nenhum animal.</div>';return}el.innerHTML=items.map(i=>`<div class="chain-item ${i.animal_id===curKey?'sel':''}" onclick="selItem('${i.animal_id}',event)"><div class="info"><div class="name">${i.nome||i.animal_id}</div><div class="sub">${i.especie} | ${i.raca}</div></div><div class="meta">${i.blocos} bloco(s)<br><span class="tag ${i.situacao==='VIVO'?'tag-green':'tag-red'}">${i.situacao}</span></div></div>`).join('')}
function filterList(){const q=document.getElementById('search').value.toLowerCase();renderList(allItems.filter(i=>(i.nome||'').toLowerCase().includes(q)||(i.especie||'').toLowerCase().includes(q)))}
async function selItem(k,ev){curKey=k;document.querySelectorAll('.chain-item').forEach(e=>e.classList.remove('sel'));ev.currentTarget.classList.add('sel');await loadDetail()}
async function loadDetail(){const dv=document.getElementById('detailView');try{const[info,tl]=await Promise.all([api(`/api/an/${curKey}`),api(`/api/an/${curKey}/timeline`)]);const e=info.data.estado||{};const timeline=tl.data||[];const em={NASCIMENTO:'🐾',COMPRA_VENDA:'💰',DOACAO:'🎁',ADOCAO:'❤️',VACINACAO:'💉',CASTRACAO:'✂️',TRATAMENTO:'🏥',CIRURGIA:'⚕️',EXAME:'🔬',DOENCA:'🤒',MICROCHIP:'📟',LICENCA:'📋',MUDANCA_NOME:'🏷️',OBITO:'💀',PERDA_TOTAL:'❌',CERTIDAO:'📄',DESDE:'📋'};dv.innerHTML=`
      <div class="status-bar"><div class="stat"><span class="stat-label">ID</span><span class="stat-value" style="font-size:0.8rem">${curKey}</span></div><div class="stat"><span class="stat-label">Nome</span><span class="stat-value">${e.nome}</span></div><div class="stat"><span class="stat-label">Espécie</span><span class="stat-value">${e.especie}</span></div><div class="stat"><span class="stat-label">Raça</span><span class="stat-value">${e.raca}</span></div><div class="stat"><span class="stat-label">Sexo</span><span class="stat-value">${e.sexo}</span></div><div class="stat"><span class="stat-label">Situação</span><span class="stat-value"><span class="tag ${e.situacao==='VIVO'?'tag-green':'tag-red'}">${e.situacao}</span></span></div><div class="stat"><span class="stat-label">Vacinas</span><span class="stat-value">${(e.vacinas||[]).length}</span></div><div class="stat"><span class="stat-label">Blocos</span><span class="stat-value">${info.data.blocos}</span></div></div>
      <div class="tabs"><div class="tab active" onclick="showTab('tl',this)">Timeline</div><div class="tab" onclick="showTab('ev',this)">Eventos</div><div class="tab" onclick="showTab('st',this)">Estado</div></div>
      <div id="mtl"><div class="card"><h2>📅 Timeline</h2>${timeline.map(ev=>`<div class="tl-item"><div style="width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:4px;flex-shrink:0"></div><div style="flex:1"><div style="display:flex;justify-content:space-between"><span>${em[ev.tipo]||''} <span class="tag tag-blue">${ev.tipo}</span></span><span style="font-size:0.7rem;color:var(--text2)">${ev.data_registro}</span></div></div></div>`).join('')}</div></div>
      <div id="mev" class="hidden"><div class="card"><h2>⚡ Eventos</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px">
        <button class="btn btn-primary btn-sm" onclick="openEvt('compra_venda')">💰 Compra/Venda</button>
        <button class="btn btn-sm" style="background:var(--purple);color:#fff" onclick="openEvt('doacao')">🎁 Doação</button>
        <button class="btn btn-sm" style="background:#f472b6;color:#000" onclick="openEvt('adocao')">❤️ Adoção</button>
        <button class="btn btn-sm" style="background:var(--yellow);color:#000" onclick="openEvt('vacinacao')">💉 Vacinação</button>
        <button class="btn btn-blue btn-sm" onclick="openEvt('castracao')">✂️ Castração</button>
        <button class="btn btn-sm" style="background:var(--green);color:#000" onclick="openEvt('tratamento')">🏥 Tratamento</button>
        <button class="btn btn-sm" style="background:var(--cyan);color:#000" onclick="openEvt('microchip')">📟 Microchip</button>
        <button class="btn btn-sm" style="background:var(--orange);color:#000" onclick="openEvt('mudanca_nome')">🏷️ Mudar Nome</button>
        <button class="btn btn-red btn-sm" onclick="openEvt('obito')">💀 Óbito</button>
      </div></div></div>
      <div id="mst" class="hidden"><div class="card"><h2>📊 Estado</h2><pre style="font-size:0.8rem;color:var(--text2);white-space:pre-wrap">${JSON.stringify(e,null,2)}</pre></div></div>`}catch(e){dv.innerHTML='<div class="empty">Erro: '+e.message+'</div>'}}
function showTab(n,el){document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');['mtl','mev','mst'].forEach(id=>document.getElementById(id).classList.add('hidden'));document.getElementById({tl:'mtl',ev:'mev',st:'mst'}[n]).classList.remove('hidden')}
const F={compra_venda:{t:'💰 Compra/Venda',f:[{l:'CPF Comprador',p:''},{l:'Nome Comprador',p:''},{l:'CPF Vendedor',p:''},{l:'Nome Vendedor',p:''},{l:'Valor (R$)',p:'2000'},{l:'Data',p:'01/06/2024'}]},doacao:{t:'🎁 Doação',f:[{l:'CPF Donatário',p:''},{l:'Nome Donatário',p:''},{l:'CPF Doador',p:''},{l:'Nome Doador',p:''},{l:'Data',p:'01/06/2024'},{l:'Motivo',p:''}]},adocao:{t:'❤️ Adoção',f:[{l:'CPF Adotante',p:''},{l:'Nome Adotante',p:''},{l:'Data',p:'01/06/2024'},{l:'Origem',tp:'sel',o:['ABRIGO','ONG','RUA']}]},vacinacao:{t:'💉 Vacinação',f:[{l:'Vacina',p:'Raiva'},{l:'Data',p:'01/04/2024'},{l:'Lote',p:''},{l:'Fabricante',p:''},{l:'Dose',p:'1a dose'}]},castracao:{t:'✂️ Castração',f:[{l:'Data',p:'01/06/2024'},{l:'Veterinário CPF',p:''},{l:'Veterinário Nome',p:''},{l:'Clínica',p:''},{l:'Método',tp:'sel',o:['Cirúrgico','Laparoscópico']}]},tratamento:{t:'🏥 Tratamento',f:[{l:'Data Início',p:'01/06/2024'},{l:'Data Fim',p:'15/06/2024'},{l:'Diagnóstico',p:''},{l:'Veterinário CPF',p:''},{l:'Veterinário Nome',p:''},{l:'Clínica',p:''},{l:'Valor (R$)',p:'500'}]},microchip:{t:'📟 Microchip',f:[{l:'Nº Microchip',p:''},{l:'Data',p:'01/06/2024'},{l:'Fabricante',p:''}]},mudanca_nome:{t:'🏷️ Mudar Nome',f:[{l:'Nome Anterior',p:''},{l:'Nome Novo',p:''},{l:'Data',p:'01/06/2024'}]},obito:{t:'💀 Óbito',f:[{l:'Data',p:'01/06/2024'},{l:'Causa',p:''},{l:'Veterinário CPF',p:''},{l:'Veterinário Nome',p:''},{l:'Local',p:''}]}};
let curEvt='';function openEvt(t){curEvt=t;const f=F[t];document.getElementById('mTitle').textContent=f.t;document.getElementById('mBody').innerHTML=f.f.map(fd=>fd.tp==='sel'?`<div style="margin-bottom:8px"><label>${fd.l}</label><select id="ef_${fd.l.replace(/[^a-z]/gi,'')}">${fd.o.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`:`<div style="margin-bottom:8px"><label>${fd.l}</label><input id="ef_${fd.l.replace(/[^a-z]/gi,'')}" placeholder="${fd.p||''}"></div>`).join('');document.getElementById('mSubmit').onclick=submitEvt;document.getElementById('mo').classList.add('active')}
function closeM(){document.getElementById('mo').classList.remove('active')}
const g=id=>document.getElementById('ef_'+id)?.value||'';
async function submitEvt(){const k=curKey;try{const p={};if(curEvt==='compra_venda')p.payload={comprador:{cpf:g('CPFComprador'),nome:g('NomeComprador')},vendedor:{cpf:g('CPDVendedor'),nome:g('NomeVendedor')},valor_transacao:parseFloat(g('ValorR'))||0,data_transacao:g('Data')};else if(curEvt==='doacao')p.payload={donatario:{cpf:g('CPDDonatrio'),nome:g('NomeDonatrio')},doador:{cpf:g('CPDDoador'),nome:g('NomeDoador')},data_doacao:g('Data'),motivo:g('Motivo')};else if(curEvt==='adocao')p.payload={adotante:{cpf:g('CPFAdotante'),nome:g('NomeAdotante')},data_adocao:g('Data'),origem:g('Origem')};else if(curEvt==='vacinacao')p.payload={nome_vacina:g('Vacina'),data_vacinacao:g('Data'),lote:g('Lote'),fabricante:g('Fabricante'),dose:g('Dose')};else if(curEvt==='castracao')p.payload={data_castracao:g('Data'),veterinario_cpf:g('VeterinrioCPF'),veterinario_nome:g('VeterinrioNome'),clinica:g('Clnica'),metodo:g('Mtodo')};else if(curEvt==='tratamento')p.payload={data_inicio:g('DataIncio'),data_fim:g('DataFim'),diagnostico:g('Dirgnstico'),veterinario_cpf:g('VeterinrioCPF'),veterinario_nome:g('VeterinrioNome'),clinica:g('Clnica'),valor:parseFloat(g('ValorR'))||0};else if(curEvt==='microchip')p.payload={numero_microchip:g('Microchip'),data_implantacao:g('Data'),fabricante:g('Fabricante')};else if(curEvt==='mudanca_nome')p.payload={nome_anterior:g('NomeAnterior'),nome_novo:g('NomeNovo'),data_mudanca:g('Data')};else if(curEvt==='obito')p.payload={data_obito:g('Data'),causa:g('Causa'),veterinario_cpf:g('VeterinrioCPF'),veterinario_nome:g('VeterinrioNome'),local:g('Local')};p.event_type={compra_venda:'COMPRA_VENDA',doacao:'DOACAO',adocao:'ADOCAO',vacinacao:'VACINACAO',castracao:'CASTRACAO',tratamento:'TRATAMENTO',microchip:'MICROCHIP',mudanca_nome:'MUDANCA_NOME',obito:'OBITO'}[curEvt];await api(`/api/an/${k}/event`,'POST',p);toast('Evento registrado!');closeM();loadDetail();loadList()}catch(e){toast(e.message,false)}}
function openNew(){document.getElementById('mTitle').textContent='🐾 Novo Animal';document.getElementById('mBody').innerHTML=[{l:'Nome',p:''},{l:'Espécie',tp:'sel',o:['CAO','GATO','CAVALO','BOVINO','OUTRO']},{l:'Raça',p:''},{l:'Sexo',tp:'sel',o:['M','F']},{l:'Data Nascimento',p:'15/03/2024'},{l:'Cor',p:''},{l:'Peso (kg)',p:'5.0'},{l:'CPF Proprietário',p:''},{l:'Nome Proprietário',p:''},{l:'UF',p:'SP'},{l:'Cidade',p:'Sao Paulo'}].map(f=>f.tp==='sel'?`<div style="margin-bottom:8px"><label>${f.l}</label><select id="n_${f.l.replace(/[^a-z]/gi,'')}">${f.o.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`:`<div style="margin-bottom:8px"><label>${f.l}</label><input id="n_${f.l.replace(/[^a-z]/gi,'')}" placeholder="${f.p}"></div>`).join('');document.getElementById('mSubmit').onclick=async()=>{const g=id=>document.getElementById('n_'+id)?.value||'';try{await api('/api/an','POST',{nome:g('Nome'),especie:g('Especie'),raca:g('Raa'),sexo:g('Sexo'),data_nascimento:g('DataNascimento'),cor:g('Cor'),peso_kg:parseFloat(g('Pesokg'))||0,proprietario_cpf:g('CPFProprietrio'),proprietario_nome:g('NomeProprietrio'),uf:g('UF'),cidade:g('Cidade')});toast('Animal registrado!');closeM();loadList()}catch(e){toast(e.message,false)}};document.getElementById('mo').classList.add('active')}
loadList();
</script>
</body>
</html>
