<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin EM — Blockchain de Embarcações</title>
<style>
:root{--bg:#0a0e17;--surface:#111827;--surface2:#1e293b;--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--accent:#06b6d4;--accent2:#0891b2;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--blue:#3b82f6;--orange:#f97316;--purple:#8b5cf6}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#0c4a6e,#0f172a);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
.header h1{font-size:1.3rem;font-weight:700}.header .badge{background:var(--accent);color:#000;padding:3px 10px;border-radius:12px;font-size:0.7rem;font-weight:600}
.header .nav{margin-left:auto;display:flex;gap:8px}.header .nav a{color:var(--text2);text-decoration:none;font-size:0.85rem;padding:6px 12px;border-radius:6px}.header .nav a:hover{background:var(--surface2);color:var(--text)}.header .nav a.active{background:var(--accent);color:#000}
.container{max-width:1200px;margin:0 auto;padding:16px}.grid2{display:grid;grid-template-columns:350px 1fr;gap:16px}
@media(max-width:768px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.card h2{font-size:1rem;margin-bottom:10px;color:var(--accent)}
input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:0.85rem;width:100%}input:focus,select:focus{outline:none;border-color:var(--accent)}
label{font-size:0.75rem;color:var(--text2);margin-bottom:2px;display:block}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#000}.btn-blue{background:var(--blue);color:#fff}.btn-red{background:var(--red);color:#fff}.btn-sm{padding:5px 12px;font-size:0.75rem}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:0.7rem;font-weight:600}
.tag-green{background:#166534;color:#86efac}.tag-red{background:#991b1b;color:#fca5a5}.tag-yellow{background:#854d0e;color:#fde047}.tag-blue{background:#1e3a5f;color:#93c5fd}.tag-purple{background:#581c87;color:#d8b4fe}
.empty{text-align:center;padding:30px;color:var(--text2)}.empty .icon{font-size:2.5rem;margin-bottom:8px}
.chain-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:6px;cursor:pointer;transition:all .2s;display:flex;justify-content:space-between;align-items:center}
.chain-item:hover{border-color:var(--accent)}.chain-item.sel{border-color:var(--accent);background:rgba(6,182,212,.1)}
.chain-item .info{flex:1}.chain-item .name{font-weight:600;font-size:0.9rem}.chain-item .sub{color:var(--text2);font-size:0.8rem}.chain-item .meta{text-align:right;font-size:0.75rem;color:var(--text2)}
.tl-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.85rem}.tl-item:last-child{border-bottom:none}
.status-bar{background:var(--surface2);border-radius:8px;padding:10px 14px;display:flex;gap:16px;font-size:0.8rem;margin-bottom:12px;flex-wrap:wrap}
.status-bar .stat{display:flex;flex-direction:column}.status-bar .stat-label{color:var(--text2);font-size:0.7rem}.status-bar .stat-value{font-weight:700;font-size:1rem}
.tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--border)}.tab{padding:7px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--text2);font-size:0.85rem}.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.hidden{display:none}.toast{position:fixed;top:16px;right:16px;padding:10px 16px;border-radius:8px;font-size:0.85rem;font-weight:600;z-index:999;animation:slideIn .3s}
.toast-ok{background:#166534;color:#86efac;border:1px solid #22c55e}.toast-err{background:#991b1b;color:#fca5a5;border:1px solid #ef4444}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center}.modal-overlay.active{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:550px;width:92%;max-height:80vh;overflow-y:auto}.modal h2{margin-bottom:12px;font-size:1.1rem}
</style>
</head>
<body>
<div class="header"><h1>⛵ Admin EM</h1><span class="badge">ECDSA</span><div class="nav"><a href="/">Home</a><a href="/admin/pf">PF</a><a href="/admin/im">IM</a><a href="/admin/mo">MO</a><a href="/admin/em" class="active">EM</a><a href="/admin/cross">Cross-Chain</a></div></div>
<div class="container"><div id="toast" class="hidden"></div><div class="grid2">
  <div><div class="card"><h2>⛵ Embarcações</h2><input id="search" placeholder="🔍 Buscar registro ou nome..." oninput="filterList()"><div id="list" style="max-height:500px;overflow-y:auto;margin-top:8px"></div><div style="margin-top:10px"><button class="btn btn-primary btn-sm" onclick="openNew()">+ Nova Embarcação</button></div></div></div>
  <div><div id="detailView"><div class="empty"><div class="icon">⛵</div>Selecione uma embarcação.</div></div></div>
</div></div>
<div class="modal-overlay" id="mo"><div class="modal"><h2 id="mTitle">Novo</h2><div id="mBody"></div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-primary btn-sm" id="mSubmit">Registrar</button><button class="btn btn-red btn-sm" onclick="closeM()">Cancelar</button></div></div></div>
<script>
let curKey='';let allItems=[];
function toast(m,ok=true){const e=document.getElementById('toast');e.textContent=m;e.className='toast toast-'+(ok?'ok':'err');e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
async function api(p,m='GET',b=null){const o={method:m,headers:{'Content-Type':'application/json'}};if(b)o.body=JSON.stringify(b);const r=await fetch(p,o);const j=await r.json();if(r.status>=400)throw new Error(j.detail||'Erro');return j}
async function loadList(){try{const r=await api('/api/em');allItems=r.data||[];renderList(allItems)}catch(e){toast(e.message,false)}}
function renderList(items){const el=document.getElementById('list');if(!items.length){el.innerHTML='<div class="empty">Nenhuma embarcação.</div>';return}el.innerHTML=items.map(i=>`<div class="chain-item ${i.registro_nr===curKey?'sel':''}" onclick="selItem('${i.registro_nr}',event)"><div class="info"><div class="name">${i.nome||i.registro_nr}</div><div class="sub">${i.tipo} | ${i.porte}</div></div><div class="meta">${i.blocos} bloco(s)<br><span class="tag ${i.situacao==='REGULAR'?'tag-green':'tag-red'}">${i.situacao}</span></div></div>`).join('')}
function filterList(){const q=document.getElementById('search').value.toLowerCase();renderList(allItems.filter(i=>i.registro_nr.toLowerCase().includes(q)||(i.nome||'').toLowerCase().includes(q)))}
async function selItem(k,ev){curKey=k;document.querySelectorAll('.chain-item').forEach(e=>e.classList.remove('sel'));ev.currentTarget.classList.add('sel');await loadDetail()}
async function loadDetail(){const dv=document.getElementById('detailView');try{const[info,tl]=await Promise.all([api(`/api/em/${curKey}`),api(`/api/em/${curKey}/timeline`)]);const e=info.data.estado||{};const timeline=tl.data||[];const em={CONSTRUCAO:'🏗️',COMPRA_VENDA:'💰',DOACAO:'🎁',LEILAO:'⚖️',REVISAO:'🔧',INSPECAO:'🔍',LICENCIAMENTO:'📋',MUDANCA_NOME:'🏷️',BAIXA:'❌',SEGURO:'🛡️',SINISTRO:'⚠️',CONFISCO:'🔒',CERTIDAO:'📄'};dv.innerHTML=`
      <div class="status-bar"><div class="stat"><span class="stat-label">Registro</span><span class="stat-value">${e.registro_nr}</span></div><div class="stat"><span class="stat-label">Nome</span><span class="stat-value">${e.nome_embarcacao}</span></div><div class="stat"><span class="stat-label">Tipo</span><span class="stat-value">${e.tipo_embarcacao}</span></div><div class="stat"><span class="stat-label">Situação</span><span class="stat-value"><span class="tag ${e.situacao==='REGULAR'?'tag-green':'tag-red'}">${e.situacao}</span></span></div><div class="stat"><span class="stat-label">Blocos</span><span class="stat-value">${info.data.blocos}</span></div></div>
      <div class="tabs"><div class="tab active" onclick="showTab('tl',this)">Timeline</div><div class="tab" onclick="showTab('ev',this)">Eventos</div><div class="tab" onclick="showTab('st',this)">Estado</div></div>
      <div id="mtl"><div class="card"><h2>📅 Timeline</h2>${timeline.map(ev=>`<div class="tl-item"><div style="width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:4px;flex-shrink:0"></div><div style="flex:1"><div style="display:flex;justify-content:space-between"><span>${em[ev.tipo]||''} <span class="tag tag-blue">${ev.tipo}</span></span><span style="font-size:0.7rem;color:var(--text2)">${ev.data_registro}</span></div></div></div>`).join('')}</div></div>
      <div id="mev" class="hidden"><div class="card"><h2>⚡ Eventos</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px">
        <button class="btn btn-primary btn-sm" onclick="openEvt('compra_venda')">💰 Compra/Venda</button>
        <button class="btn btn-sm" style="background:var(--purple);color:#fff" onclick="openEvt('doacao')">🎁 Doação</button>
        <button class="btn btn-sm" style="background:var(--yellow);color:#000" onclick="openEvt('revisao')">🔧 Revisão</button>
        <button class="btn btn-blue btn-sm" onclick="openEvt('inspecao')">🔍 Inspeção</button>
        <button class="btn btn-sm" style="background:var(--green);color:#000" onclick="openEvt('licenciamento')">📋 Licenciamento</button>
        <button class="btn btn-sm" style="background:var(--cyan);color:#000" onclick="openEvt('mudanca_nome')">🏷️ Mudar Nome</button>
        <button class="btn btn-sm" style="background:var(--blue);color:#fff" onclick="openEvt('seguro')">🛡️ Seguro</button>
        <button class="btn btn-red btn-sm" onclick="openEvt('sinistro')">⚠️ Sinistro</button>
        <button class="btn btn-red btn-sm" onclick="openEvt('baixa')">❌ Baixa</button>
      </div></div></div>
      <div id="mst" class="hidden"><div class="card"><h2>📊 Estado</h2><pre style="font-size:0.8rem;color:var(--text2);white-space:pre-wrap">${JSON.stringify(e,null,2)}</pre></div></div>`}catch(e){dv.innerHTML='<div class="empty">Erro: '+e.message+'</div>'}}
function showTab(n,el){document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');['mtl','mev','mst'].forEach(id=>document.getElementById(id).classList.add('hidden'));document.getElementById({tl:'mtl',ev:'mev',st:'mst'}[n]).classList.remove('hidden')}
const F={compra_venda:{t:'💰 Compra/Venda',f:[{l:'CPF Comprador',p:''},{l:'Nome Comprador',p:''},{l:'CPF Vendedor',p:''},{l:'Nome Vendedor',p:''},{l:'Valor (R$)',p:'50000'},{l:'Data',p:'01/06/2024'}]},doacao:{t:'🎁 Doação',f:[{l:'CPF Donatário',p:''},{l:'Nome Donatário',p:''},{l:'CPF Doador',p:''},{l:'Nome Doador',p:''},{l:'Data',p:'01/06/2024'}]},revisao:{t:'🔧 Revisão',f:[{l:'Data',p:'01/09/2024'},{l:'Oficina',p:''},{l:'Tipo',tp:'sel',o:['PREVENTIVA','CORRETIVA']},{l:'Itens',p:'Motor, Casco'},{l:'Valor (R$)',p:'2000'}]},inspecao:{t:'🔍 Inspeção',f:[{l:'Data',p:'01/03/2024'},{l:'Órgão',p:'Capitania dos Portos'},{l:'Resultado',tp:'sel',o:['APROVADA','REPROVADA']}]},licenciamento:{t:'📋 Licenciamento',f:[{l:'Ano',p:'2024'},{l:'Data',p:'01/03/2024'},{l:'Órgão',p:''}]},mudanca_nome:{t:'🏷️ Mudar Nome',f:[{l:'Nome Anterior',p:''},{l:'Nome Novo',p:''},{l:'Data',p:'01/06/2024'}]},seguro:{t:'🛡️ Seguro',f:[{l:'Seguradora',p:''},{l:'CNPJ',p:''},{l:'Apólice',p:''},{l:'Data Início',p:'01/01/2024'},{l:'Data Fim',p:'01/01/2025'},{l:'Valor Segurado',p:'100000'}]},sinistro:{t:'⚠️ Sinistro',f:[{l:'Data',p:'15/06/2024'},{l:'Tipo',tp:'sel',o:['COLISAO','INCENDIO','ALAGAMENTO','OUTRO']},{l:'Descrição',p:''},{l:'Valor Dano',p:'15000'}]},baixa:{t:'❌ Baixa',f:[{l:'Data',p:'01/01/2025'},{l:'Motivo',p:''}]}};
let curEvt='';function openEvt(t){curEvt=t;const f=F[t];document.getElementById('mTitle').textContent=f.t;document.getElementById('mBody').innerHTML=f.f.map(fd=>fd.tp==='sel'?`<div style="margin-bottom:8px"><label>${fd.l}</label><select id="ef_${fd.l.replace(/[^a-z]/gi,'')}">${fd.o.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`:`<div style="margin-bottom:8px"><label>${fd.l}</label><input id="ef_${fd.l.replace(/[^a-z]/gi,'')}" placeholder="${fd.p||''}"></div>`).join('');document.getElementById('mSubmit').onclick=submitEvt;document.getElementById('mo').classList.add('active')}
function closeM(){document.getElementById('mo').classList.remove('active')}
const g=id=>document.getElementById('ef_'+id)?.value||'';
async function submitEvt(){const k=curKey;try{const p={};if(curEvt==='compra_venda')p.payload={comprador:{cpf:g('CPFComprador'),nome:g('NomeComprador')},vendedor:{cpf:g('CPDVendedor'),nome:g('NomeVendedor')},valor_transacao:parseFloat(g('ValorR'))||0,data_transacao:g('Data')};else if(curEvt==='doacao')p.payload={donatario:{cpf:g('CPDDonatrio'),nome:g('NomeDonatrio')},doador:{cpf:g('CPDDoador'),nome:g('NomeDoador')},data_doacao:g('Data')};else if(curEvt==='revisao')p.payload={data_revisao:g('Data'),oficina:g('Oficina'),tipo_revisao:g('Tipo'),itens_revisados:g('Itens').split(',').map(s=>s.trim()),valor_total:parseFloat(g('ValorR'))||0};else if(curEvt==='inspecao')p.payload={data_inspecao:g('Data'),orgao_inspecao:g('rgo'),resultado:g('Resultado')};else if(curEvt==='licenciamento')p.payload={ano_licenciamento:parseInt(g('Ano'))||2024,data_licenciamento:g('Data'),orgao_emissor:g('rgo')};else if(curEvt==='mudanca_nome')p.payload={nome_anterior:g('NomeAnterior'),nome_novo:g('NomeNovo'),data_mudanca:g('Data')};else if(curEvt==='seguro')p.payload={seguradora_nome:g('Seguradora'),seguradora_cnpj:g('CNPJ'),apolice_numero:g('plice'),data_inicio:g('DataIncio'),data_fim:g('DataFim'),valor_segurado:parseFloat(g('ValorSegurado'))||0};else if(curEvt==='sinistro')p.payload={data_sinistro:g('Data'),tipo:g('Tipo'),descricao:g('Descrio'),valor_dano:parseFloat(g('ValorDano'))||0};else if(curEvt==='baixa')p.payload={data_baixa:g('Data'),motivo:g('Motivo')};p.event_type={compra_venda:'COMPRA_VENDA',doacao:'DOACAO',revisao:'REVISAO',inspecao:'INSPECAO',licenciamento:'LICENCIAMENTO',mudanca_nome:'MUDANCA_NOME',seguro:'SEGURO',sinistro:'SINISTRO',baixa:'BAIXA'}[curEvt];await api(`/api/em/${k}/event`,'POST',p);toast('Evento registrado!');closeM();loadDetail();loadList()}catch(e){toast(e.message,false)}}
function openNew(){document.getElementById('mTitle').textContent='⛵ Nova Embarcação';document.getElementById('mBody').innerHTML=[{l:'Registro NR',p:''},{l:'Nome',p:''},{l:'Tipo',tp:'sel',o:['Lancha','Veleiro','Iate','Barco','Catamarã']},{l:'Porte',tp:'sel',o:['PEQUENO','MEDIO','GRANDE']},{l:'Comprimento (m)',p:'8.5'},{l:'Boca (m)',p:'3.0'},{l:'Pontal (m)',p:'1.5'},{l:'Calado (m)',p:'0.8'},{l:'Deslocamento (ton)',p:'2.5'},{l:'Material Casco',p:'Fibra'},{l:'Motorização',p:'Fora-de-borda'},{l:'Potência (CV)',p:'150'},{l:'UF',p:'SP'},{l:'Cidade',p:'Sao Paulo'}].map(f=>f.tp==='sel'?`<div style="margin-bottom:8px"><label>${f.l}</label><select id="n_${f.l.replace(/[^a-z]/gi,'')}">${f.o.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`:`<div style="margin-bottom:8px"><label>${f.l}</label><input id="n_${f.l.replace(/[^a-z]/gi,'')}" placeholder="${f.p}"></div>`).join('');document.getElementById('mSubmit').onclick=async()=>{const g=id=>document.getElementById('n_'+id)?.value||'';try{await api('/api/em','POST',{registro_nr:g('RegistroNR'),nome_embarcacao:g('Nome'),tipo_embarcacao:g('Tipo'),porte:g('Porte'),comprimento_m:parseFloat(g('Comprimentom'))||0,beam_m:parseFloat(g('Bocam'))||0,pontal_m:parseFloat(g('Pontalm'))||0,calado_m:parseFloat(g('Caladom'))||0,deslocamento_ton:parseFloat(g('Deslocamentoton'))||0,casco_material:g('MaterialCasco'),motorizacao:g('Motorizao'),motor_potencia_cv:parseFloat(g('PotnciCV'))||0,uf:g('UF'),cidade:g('Cidade')});toast('Embarcação criada!');closeM();loadList()}catch(e){toast(e.message,false)}};document.getElementById('mo').classList.add('active')}
loadList();
</script>
</body>
</html>
